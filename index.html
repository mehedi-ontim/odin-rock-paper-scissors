<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <p>First to 5 points wins!</p>

    <div id="choices">
      <button type="button" data-choice="rock">Rock</button>
      <button type="button" data-choice="paper">Paper</button>
      <button type="button" data-choice="scissors">Scissors</button>
    </div>

    <div id="results">
      <p id="round-result" aria-live="polite">Choose a move to begin.</p>

      <p id="score">You: 0 | Computer: 0</p>

      <h2 id="game-result" aria-live="polite"></h2>
    </div>
  </body>
</html>
